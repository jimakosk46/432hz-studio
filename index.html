<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>432Hz Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="icon192.png">
<meta name="theme-color" content="#0a0618">
<style>
  :root {
    --bg: #0a0618; --panel: rgba(22,16,51,.78); --panel2: #221745;
    --text: #f1ecff; --muted: #a89fc7; --accent: #ffc76b;
    --accent2: #45d8d0; --danger: #ff7ba1; --border: #3b2a63;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text); min-height: 100vh; padding: 24px 16px 60px;
  }
  /* κοσμικό φόντο: νεφελώματα + δύση στον ορίζοντα */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1000px 540px at 10% -6%, rgba(61,229,199,.20), transparent 62%),
      radial-gradient(900px 560px at 96% 4%, rgba(255,94,196,.17), transparent 62%),
      radial-gradient(820px 520px at 88% 96%, rgba(160,107,255,.18), transparent 65%),
      radial-gradient(700px 430px at 50% 106%, rgba(255,150,60,.20), transparent 62%),
      radial-gradient(420px 260px at 50% 102%, rgba(255,205,110,.14), transparent 60%),
      var(--bg);
  }
  /* έναστρος ουρανός */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      radial-gradient(1.2px 1.2px at 22px 34px, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 88px 12px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.6px 1.6px at 146px 68px, rgba(255,212,121,.85), transparent),
      radial-gradient(1px 1px at 203px 122px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.4px 1.4px at 58px 172px, rgba(170,220,255,.75), transparent),
      radial-gradient(1px 1px at 132px 214px, rgba(255,255,255,.65), transparent),
      radial-gradient(1.3px 1.3px at 234px 40px, rgba(255,150,214,.7), transparent);
    background-size: 260px 260px;
    animation: twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; position: relative; }
  header::before {
    content: ''; position: absolute; left: 50%; top: -46px; transform: translateX(-50%);
    width: 190px; height: 190px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(255,190,90,.30), rgba(255,94,196,.12) 52%, transparent 72%);
  }
  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 22px rgba(160,107,255,.5); }
  header h1 span {
    background: linear-gradient(100deg, #ffd479, #ff9d5c 45%, #ff5ec4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,199,107,.35));
  }
  header p { color: var(--muted); margin-top: 6px; font-size: .95rem; }
  .langs { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .langs .chip { font-size: .8rem; padding: 5px 12px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1 1 150px; padding: 12px 6px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); color: var(--muted); font-size: .9rem;
    cursor: pointer; transition: all .15s;
  }
  .tab.active {
    background: linear-gradient(180deg, #2c1d58, #221745); color: #ffe6bd;
    border-color: var(--accent); box-shadow: 0 0 16px rgba(255,199,107,.22);
  }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; box-shadow: 0 10px 34px rgba(0,0,0,.45);
  }
  .hidden { display: none; }
  label.small { display: block; color: var(--muted); font-size: .85rem; margin: 16px 0 6px; }

  #drop {
    border: 2px dashed var(--border); border-radius: 12px; padding: 30px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  #drop:hover { border-color: var(--accent); color: var(--text); background: #1d1440; }
  #drop .big { font-size: 2rem; display: block; margin-bottom: 8px; }
  #fileName { color: var(--accent); font-weight: 600; margin-top: 10px; word-break: break-all; }
  .note {
    margin-top: 14px; padding: 12px; border-radius: 10px; background: #1b1338;
    color: var(--muted); font-size: .82rem; line-height: 1.5;
  }
  #liveAudio { width: 100%; margin-top: 14px; }

  .freq-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=number] {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 1rem; width: 110px;
  }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); cursor: pointer; font-size: .9rem;
  }
  .chip.sel { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(255,199,107,.2); }

  .btn {
    display: block; width: 100%; margin-top: 20px; padding: 14px;
    border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
    background: linear-gradient(135deg, #ffd479, #ff9455); color: #331803;
    cursor: pointer; transition: filter .15s; box-shadow: 0 4px 18px rgba(255,157,70,.25);
  }
  .btn:hover { filter: brightness(1.1); }

  .freq-display { text-align: center; margin: 6px 0 14px; }
  .freq-display input {
    width: 200px; font-size: 2.2rem; text-align: center; font-weight: 600;
    color: var(--accent);
  }
  .freq-display .hz { color: var(--muted); font-size: 1.2rem; margin-left: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
  select {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 1rem; width: 100%;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .playbtns { display: flex; gap: 10px; margin-top: 20px; }
  .playbtns .btn { margin-top: 0; }
  .btn.stop { background: linear-gradient(135deg, #ff7ba1, #d8447c); color: #33051a; }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  footer { text-align: center; color: #8f83b8; font-size: .8rem; margin-top: 26px; line-height: 1.5; }

  .tones { display: grid; gap: 12px; }
  .tonecard {
    display: flex; gap: 14px; align-items: center; padding: 14px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--panel2);
  }
  .tonecard .freq {
    min-width: 86px; text-align: center; font-weight: 700; font-size: 1.05rem;
    color: var(--accent); background: rgba(255,199,107,.08); border: 1px solid #6b5527;
    border-radius: 10px; padding: 10px 6px;
  }
  .tonecard .freq small { display: block; font-weight: 400; color: var(--muted); font-size: .7rem; }
  .tonecard .info { flex: 1; }
  .tonecard .info b { display: block; margin-bottom: 3px; }
  .tonecard .info small { color: var(--muted); line-height: 1.45; }
  .tonecard .phones {
    display: inline-block; margin: 2px 0 6px; padding: 3px 10px; border-radius: 12px;
    background: #2e2410; border: 1px solid #6b5a2a; color: #ffd479;
    font-size: .72rem; font-weight: 600; line-height: 1.4;
  }
  .tonecard .acts { display: flex; flex-direction: column; gap: 8px; min-width: 132px; }
  .tonecard .pl, .tonecard .yt {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    cursor: pointer; font-size: .88rem; white-space: nowrap; text-align: center;
    text-decoration: none; display: block;
  }
  .tonecard .pl { background: var(--panel); color: var(--accent); }
  .tonecard .pl.on { background: #3a1c2e; border-color: #7a3a5c; color: var(--danger); }
  .tonecard .mus { background: #0e2e35; color: var(--accent2); border-color: #2a5e63; }
  .tonecard .mus.on { background: #12474d; color: #c9fff4; border-color: var(--accent2); }
  .tonecard .yt { background: #2a1518; color: #ff9d8a; border-color: #5c2f2f; font-size: .78rem; padding: 7px 10px; }
  @media (max-width: 620px) {
    .tonecard { flex-wrap: wrap; }
    .tonecard .acts { flex-direction: row; width: 100%; min-width: 0; }
    .tonecard .acts > * { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎵 <span>432Hz</span> Studio</h1>
    <p data-i18n="subtitle"></p>
    <p style="color:#8f83b8;font-size:.82rem;margin-top:3px" data-i18n="credit"></p>
    <div class="langs">
      <button class="chip" data-l="el">Ελληνικά</button>
      <button class="chip" data-l="de">Deutsch</button>
      <button class="chip" data-l="en">English</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="conv" data-i18n="tab_conv"></button>
    <button class="tab" data-tab="tone" data-i18n="tab_tone"></button>
    <button class="tab" data-tab="heal" data-i18n="tab_heal"></button>
    <button class="tab" data-tab="chladni" data-i18n="tab_chl"></button>
  </div>

  <!-- ===================== LIVE 432Hz PLAYER ===================== -->
  <div class="card" id="panel-conv">
    <div id="drop">
      <span class="big">🎧</span>
      <span data-i18n="drop_text"></span>
      <div style="font-size:.8rem;margin-top:6px">MP3, WAV, FLAC, M4A, OGG…</div>
      <div id="fileName"></div>
    </div>
    <input type="file" id="file" accept="audio/*" style="display:none">

    <label class="small" data-i18n="target_label"></label>
    <div class="freq-row">
      <input type="number" id="target" value="432" min="300" max="500" step="0.1">
      <button class="chip sel" data-f="432">432 Hz</button>
      <button class="chip" data-f="444">444 Hz</button>
      <button class="chip" data-f="424">424 Hz</button>
    </div>

    <audio id="liveAudio" controls class="hidden"></audio>
    <div class="note" data-i18n="live_note"></div>
  </div>

  <!-- ===================== TONE GENERATOR ===================== -->
  <div class="card hidden" id="panel-tone">
    <div class="freq-display">
      <input type="number" id="tfreq" value="432" min="1" max="20000" step="0.1"><span class="hz">Hz</span>
    </div>
    <input type="range" id="tslider" min="0" max="1000" value="614">

    <div class="presets">
      <button class="chip" data-f="174">174</button>
      <button class="chip" data-f="285">285</button>
      <button class="chip" data-f="396">396</button>
      <button class="chip" data-f="417">417</button>
      <button class="chip sel" data-f="432">432</button>
      <button class="chip" data-f="528">528</button>
      <button class="chip" data-f="639">639</button>
      <button class="chip" data-f="741">741</button>
      <button class="chip" data-f="852">852</button>
      <button class="chip" data-f="963">963</button>
    </div>

    <div class="row2" style="margin-top:18px">
      <div>
        <label class="small" data-i18n="waveform"></label>
        <select id="wave">
          <option value="sine" data-i18n="wave_sine"></option>
          <option value="triangle" data-i18n="wave_triangle"></option>
          <option value="square" data-i18n="wave_square"></option>
          <option value="sawtooth" data-i18n="wave_saw"></option>
        </select>
      </div>
      <div>
        <label class="small" data-i18n="volume"></label>
        <input type="range" id="vol" min="0" max="100" value="40" style="margin-top:12px">
      </div>
    </div>

    <div class="playbtns">
      <button class="btn" id="play" data-i18n="play"></button>
      <button class="btn stop hidden" id="stop" data-i18n="stop"></button>
    </div>

    <label class="small" data-i18n="wav_label"></label>
    <div class="freq-row">
      <input type="number" id="wavdur" value="60" min="1" max="600">
      <button class="btn ghost" id="wavdl" style="flex:1;margin-top:0;width:auto" data-i18n="wav_btn"></button>
    </div>
  </div>

  <!-- ===================== HEALING TONES ===================== -->
  <div class="card hidden" id="panel-heal">
    <div class="tones" id="tonelist"></div>
  </div>

  <!-- ===================== CHLADNI PATTERNS ===================== -->
  <div class="card hidden" id="panel-chladni">
    <div class="note" data-i18n="chl_note"></div>
    <div style="text-align:center;margin-top:14px">
      <canvas id="chl" width="300" height="300" style="width:100%;max-width:340px;height:auto;border-radius:12px;border:1px solid var(--border);background:#181030"></canvas>
    </div>
    <div id="chlStatus" style="text-align:center;margin-top:10px;min-height:22px;font-size:.9rem"></div>
    <label class="small" data-i18n="chl_freq"></label>
    <div class="freq-row">
      <input type="number" id="chlFreq" value="432" min="200" max="1000" step="0.1">
      <button class="chip sel" data-f="432">432 Hz</button>
      <button class="chip" data-f="440">440 Hz</button>
      <button class="chip" data-f="528">528 Hz</button>
    </div>
    <input type="range" id="chlSlider" min="200" max="1000" step="0.5" value="432" style="margin-top:10px">
    <label class="small" data-i18n="chl_plate"></label>
    <input type="range" id="chlPlate" min="90" max="110" step="0.1" value="100">
  </div>

  <footer>432Hz Studio · <span data-i18n="credit"></span><br><span data-i18n="install_hint"></span></footer>
</div>

<script>
// ---------- i18n ----------
const I18N = {
  el: {
    subtitle: 'Θεραπευτικές συχνότητες & γεννήτρια τόνων',
    tab_conv: 'Τραγούδι στα 432Hz', tab_tone: 'Γεννήτρια τόνων', tab_heal: 'Θεραπευτικοί τόνοι',
    drop_text: 'Διάλεξε ένα τραγούδι από το κινητό σου',
    target_label: 'Συχνότητα-στόχος (αναφορά Λα = 440Hz)',
    live_note: 'Το τραγούδι παίζει ζωντανά κουρδισμένο στη συχνότητα-στόχο (κλασική μέθοδος: ~1,8% πιο αργό, φυσικός ήχος χωρίς παραμόρφωση).',
    waveform: 'Κυματομορφή', wave_sine: 'Ημίτονο (απαλό)', wave_triangle: 'Τρίγωνο',
    wave_square: 'Τετράγωνο', wave_saw: 'Πριόνι', volume: 'Ένταση',
    play: '▶ Αναπαραγωγή', stop: '■ Στοπ',
    wav_label: 'Λήψη ως αρχείο WAV — διάρκεια (δευτερόλεπτα)', wav_btn: '💾 Λήψη WAV',
    pure_tone: '▶ Καθαρός τόνος', stop_short: '■ Στοπ',
    music_btn: '🎵 Μουσική {f}Hz', music_stop: '■ Στοπ {f}Hz',
    need_phones: '🎧 Απαραίτητα ακουστικά — ο παλμός δημιουργείται από τη διαφορά των δύο αυτιών',
    install_hint: 'Συμβουλή: μενού browser → «Προσθήκη στην αρχική οθόνη» για να γίνει κανονικό app (δουλεύει και χωρίς internet).',
    credit: 'από τον Δημήτρη Κατσαβό',
    tab_chl: 'Σχήματα ήχου',
    chl_note: 'Προσομοίωση πλάκας Chladni: η «άμμος» μαζεύεται εκεί όπου η πλάκα δεν δονείται. Καθαρό, συμμετρικό σχήμα βγαίνει όταν η συχνότητα πετυχαίνει συντονισμό της πλάκας. Δοκίμασε 432 και 440 — και μετά άλλαξε λίγο το «μέγεθος πλάκας»: κάθε συχνότητα έχει την πλάκα που τη βγάζει πανέμορφη.',
    chl_freq: 'Συχνότητα (Hz)',
    chl_plate: 'Μέγεθος πλάκας',
    chl_on: '✨ Συντονισμός στα {f}Hz — καθαρό, συμμετρικό σχήμα!',
    chl_off: 'Εκτός συντονισμού — θολό σχήμα. Κοντινότερος συντονισμός: {f}Hz',
  },
  de: {
    subtitle: 'Heilfrequenzen & Tongenerator',
    tab_conv: 'Song in 432Hz', tab_tone: 'Tongenerator', tab_heal: 'Heilfrequenzen',
    drop_text: 'Wähle einen Song von deinem Handy',
    target_label: 'Zielfrequenz (Referenz A = 440Hz)',
    live_note: 'Der Song spielt live auf die Zielfrequenz gestimmt (klassische Methode: ~1,8% langsamer, natürlicher Klang ohne Verzerrung).',
    waveform: 'Wellenform', wave_sine: 'Sinus (sanft)', wave_triangle: 'Dreieck',
    wave_square: 'Rechteck', wave_saw: 'Sägezahn', volume: 'Lautstärke',
    play: '▶ Wiedergabe', stop: '■ Stopp',
    wav_label: 'Als WAV-Datei speichern — Dauer (Sekunden)', wav_btn: '💾 WAV speichern',
    pure_tone: '▶ Reiner Ton', stop_short: '■ Stopp',
    music_btn: '🎵 Musik {f}Hz', music_stop: '■ Stopp {f}Hz',
    need_phones: '🎧 Kopfhörer erforderlich — der Puls entsteht aus der Differenz der beiden Ohren',
    install_hint: 'Tipp: Browser-Menü → „Zum Startbildschirm hinzufügen" — dann funktioniert es wie eine App (auch offline).',
    credit: 'von Dimitri Katsavos',
    tab_chl: 'Klangmuster',
    chl_note: 'Chladni-Platten-Simulation: Der „Sand" sammelt sich dort, wo die Platte nicht schwingt. Ein klares, symmetrisches Muster entsteht, wenn die Frequenz eine Resonanz der Platte trifft. Probiere 432 und 440 — und ändere dann leicht die Plattengröße: Jede Frequenz hat eine Platte, auf der sie wunderschön aussieht.',
    chl_freq: 'Frequenz (Hz)',
    chl_plate: 'Plattengröße',
    chl_on: '✨ Resonanz bei {f}Hz — klares, symmetrisches Muster!',
    chl_off: 'Außerhalb der Resonanz — verschwommenes Muster. Nächste Resonanz: {f}Hz',
  },
  en: {
    subtitle: 'Healing frequencies & tone generator',
    tab_conv: 'Song at 432Hz', tab_tone: 'Tone generator', tab_heal: 'Healing tones',
    drop_text: 'Choose a song from your phone',
    target_label: 'Target frequency (reference A = 440Hz)',
    live_note: 'The song plays live tuned to the target frequency (classic method: ~1.8% slower, natural sound with no distortion).',
    waveform: 'Waveform', wave_sine: 'Sine (soft)', wave_triangle: 'Triangle',
    wave_square: 'Square', wave_saw: 'Sawtooth', volume: 'Volume',
    play: '▶ Play', stop: '■ Stop',
    wav_label: 'Download as WAV file — duration (seconds)', wav_btn: '💾 Download WAV',
    pure_tone: '▶ Pure tone', stop_short: '■ Stop',
    music_btn: '🎵 Music {f}Hz', music_stop: '■ Stop {f}Hz',
    need_phones: '🎧 Headphones required — the pulse is created by the difference between the two ears',
    install_hint: 'Tip: browser menu → "Add to Home screen" to use it like a real app (works offline too).',
    credit: 'by Dimitri Katsavos',
    tab_chl: 'Sound patterns',
    chl_note: 'Chladni plate simulation: the "sand" gathers where the plate does not vibrate. A clear, symmetric pattern appears when the frequency hits a resonance of the plate. Try 432 and 440 — then slightly change the plate size: every frequency has a plate that makes it beautiful.',
    chl_freq: 'Frequency (Hz)',
    chl_plate: 'Plate size',
    chl_on: '✨ Resonance at {f}Hz — clear symmetric pattern!',
    chl_off: 'Off resonance — blurred pattern. Nearest resonance: {f}Hz',
  },
};
let LANG = localStorage.getItem('lang432') || 'el';
if (!I18N[LANG]) LANG = 'el';
const T = k => (I18N[LANG] && I18N[LANG][k]) || I18N.el[k] || k;

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  ['conv', 'tone', 'heal', 'chladni'].forEach(name =>
    document.getElementById('panel-' + name).classList.toggle('hidden', t.dataset.tab !== name));
});

// ---------- live 432Hz player (client-side) ----------
const drop = document.getElementById('drop'), fileInp = document.getElementById('file');
const fileName = document.getElementById('fileName');
const liveAudio = document.getElementById('liveAudio');
const targetInp = document.getElementById('target');
let liveUrl = null;

function liveRate() {
  const t = +targetInp.value || 432;
  return Math.min(500, Math.max(300, t)) / 440;
}
function applyLiveRate() {
  try {
    liveAudio.preservesPitch = false;
    if ('webkitPreservesPitch' in liveAudio) liveAudio.webkitPreservesPitch = false;
    const r = liveRate();
    if (Math.abs(liveAudio.playbackRate - r) > 0.0005) liveAudio.playbackRate = r;
  } catch (e) {}
}
drop.onclick = () => fileInp.click();
fileInp.onchange = () => {
  const f = fileInp.files[0];
  if (!f) return;
  if (liveUrl) URL.revokeObjectURL(liveUrl);
  liveUrl = URL.createObjectURL(f);
  fileName.textContent = '✓ ' + f.name;
  liveAudio.src = liveUrl;
  liveAudio.classList.remove('hidden');
  applyLiveRate();
  liveAudio.play().catch(() => {});
};
['ratechange', 'play', 'loadedmetadata'].forEach(ev => liveAudio.addEventListener(ev, applyLiveRate));
targetInp.oninput = applyLiveRate;
document.querySelectorAll('#panel-conv .chip').forEach(c => c.onclick = () => {
  targetInp.value = c.dataset.f;
  document.querySelectorAll('#panel-conv .chip').forEach(x => x.classList.toggle('sel', x === c));
  applyLiveRate();
});

// ---------- tone generator ----------
const tfreq = document.getElementById('tfreq'), tslider = document.getElementById('tslider');
const volInp = document.getElementById('vol'), waveSel = document.getElementById('wave');
let ctx = null, osc = null, gain = null;

const smin = Math.log(20), smax = Math.log(2000);
function sliderToFreq(v) { return Math.exp(smin + (smax - smin) * v / 1000); }
function freqToSlider(f) { return Math.round((Math.log(f) - smin) / (smax - smin) * 1000); }

tslider.oninput = () => { tfreq.value = sliderToFreq(+tslider.value).toFixed(1); applyFreq(); };
tfreq.oninput = () => { const f = +tfreq.value; if (f >= 20 && f <= 2000) tslider.value = freqToSlider(f); applyFreq(); };
document.querySelectorAll('#panel-tone .chip').forEach(c => c.onclick = () => {
  tfreq.value = c.dataset.f; tslider.value = freqToSlider(+c.dataset.f);
  document.querySelectorAll('#panel-tone .chip').forEach(x => x.classList.toggle('sel', x === c));
  applyFreq();
});
volInp.oninput = () => { if (gain) gain.gain.setTargetAtTime(vol(), ctx.currentTime, .02); };
waveSel.onchange = () => { if (osc) osc.type = waveSel.value; };

function vol() { return Math.pow(+volInp.value / 100, 2) * 0.5; }
function applyFreq() { if (osc) osc.frequency.setTargetAtTime(+tfreq.value || 432, ctx.currentTime, .02); }

function startTone() {
  if (osc) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  osc = ctx.createOscillator(); gain = ctx.createGain();
  osc.type = waveSel.value;
  osc.frequency.value = +tfreq.value || 432;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(vol(), ctx.currentTime + .05);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  syncUI();
}
function stopTone() {
  if (!osc) return;
  const o = osc, g = gain; osc = null; gain = null;
  g.gain.setTargetAtTime(0, ctx.currentTime, .03);
  setTimeout(() => { o.stop(); o.disconnect(); g.disconnect(); }, 200);
  syncUI();
}
function syncUI() {
  const playing = !!osc;
  document.getElementById('play').classList.toggle('hidden', playing);
  document.getElementById('stop').classList.toggle('hidden', !playing);
  document.querySelectorAll('.tonecard .pl').forEach(b => {
    const on = playing && Math.abs(+b.dataset.f - +tfreq.value) < 0.01;
    b.classList.toggle('on', on);
    b.textContent = on ? T('stop_short') : T('pure_tone');
  });
}
document.getElementById('play').onclick = startTone;
document.getElementById('stop').onclick = stopTone;

const list = document.getElementById('tonelist');

function renderTones() {
  list.innerHTML = '';
  TONES.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tonecard';
    const ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(t.yt);
    const musOn = musicF === t.f;
    const phones = t.f < 60 ? `<span class="phones">${T('need_phones')}</span>` : '';
    el.innerHTML = `<div class="freq">${t.f}<small>Hz</small></div>
      <div class="info"><b>${t.name[LANG]}</b>${phones}<small>${t.desc[LANG]}</small></div>
      <div class="acts">
        <button class="mus${musOn ? ' on' : ''}" data-f="${t.f}">${T(musOn ? 'music_stop' : 'music_btn').replace('{f}', t.f)}</button>
        <button class="pl" data-f="${t.f}">${T('pure_tone')}</button>
        <a class="yt" href="${ytUrl}" target="_blank" rel="noopener">🔎 YouTube</a>
      </div>`;
    el.querySelector('.pl').onclick = () => {
      const playingThis = osc && Math.abs(+tfreq.value - t.f) < 0.01;
      if (playingThis) { stopTone(); return; }
      stopMusic();
      tfreq.value = t.f;
      if (t.f >= 20 && t.f <= 2000) tslider.value = freqToSlider(t.f);
      applyFreq();
      if (!osc) startTone(); else syncUI();
    };
    el.querySelector('.mus').onclick = () => toggleMusic(t.f, el.querySelector('.mus'));
    list.appendChild(el);
  });
  syncUI();
}

let music = null, musicF = null;
function stopMusic() {
  if (music) { music.pause(); music.src = ''; music = null; musicF = null; }
  document.querySelectorAll('.tonecard .mus').forEach(b => {
    b.classList.remove('on'); b.textContent = T('music_btn').replace('{f}', b.dataset.f);
  });
}
function toggleMusic(f, btn) {
  if (musicF === f) { stopMusic(); return; }
  stopMusic();
  stopTone();
  music = new Audio('tracks/' + encodeURIComponent(f) + '.mp3');
  music.loop = true;
  music.play().catch(() => {});
  musicF = f;
  btn.classList.add('on'); btn.textContent = T('music_stop').replace('{f}', f);
}

// ---------- WAV download (client-side) ----------
document.getElementById('wavdl').onclick = () => {
  const f = +tfreq.value || 432;
  const dur = Math.min(600, Math.max(1, +document.getElementById('wavdur').value || 60));
  const sr = 44100, n = Math.floor(sr * dur), amp = 0.6;
  const type = waveSel.value;
  const data = new Int16Array(n);
  const fade = sr * 0.05;
  for (let i = 0; i < n; i++) {
    const ph = (i * f / sr) % 1;
    let s;
    if (type === 'sine') s = Math.sin(2 * Math.PI * ph);
    else if (type === 'square') s = ph < 0.5 ? 1 : -1;
    else if (type === 'sawtooth') s = 2 * ph - 1;
    else s = ph < 0.5 ? 4 * ph - 1 : 3 - 4 * ph;
    let env = 1;
    if (i < fade) env = i / fade;
    else if (i > n - fade) env = (n - i) / fade;
    data[i] = Math.round(s * amp * env * 32767);
  }
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, n * 2, true);
  new Int16Array(buf, 44).set(data);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  a.download = `tone_${f}Hz_${type}_${dur}s.wav`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---------- Chladni patterns ----------
const chlCanvas = document.getElementById('chl');
const chlFreq = document.getElementById('chlFreq');
const chlSlider = document.getElementById('chlSlider');
const chlPlate = document.getElementById('chlPlate');
const chlStatus = document.getElementById('chlStatus');
const CHL_MODES = [];
for (let m = 1; m <= 9; m++) for (let n = m + 1; n <= 10; n++) CHL_MODES.push([m, n, m * m + n * n]);

function drawChladni() {
  const f = Math.min(1000, Math.max(200, +chlFreq.value || 432));
  const k = (432 / 34) * (+chlPlate.value / 100); // πλάκα 100% → το 432 πέφτει ακριβώς σε συντονισμό
  let bm = 3, bn = 5, bf = 0, bd = 1e9;
  for (const [m, n, s] of CHL_MODES) {
    const fr = k * s, d = Math.abs(f - fr);
    if (d < bd) { bd = d; bm = m; bn = n; bf = fr; }
  }
  const crisp = Math.exp(-Math.pow(bd / (f * 0.012), 2)); // 1 = τέλειος συντονισμός
  const W = chlCanvas.width, H = chlCanvas.height;
  const g = chlCanvas.getContext('2d');
  const img = g.createImageData(W, H);
  const sigma = 0.06 + (1 - crisp) * 0.5; // εκτός συντονισμού → θολές γραμμές
  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const cmv = Math.cos(bm * Math.PI * v), cnv = Math.cos(bn * Math.PI * v);
    for (let x = 0; x < W; x++) {
      const u = x / (W - 1);
      const a = Math.cos(bn * Math.PI * u) * cmv - Math.cos(bm * Math.PI * u) * cnv;
      let s = Math.exp(-(a * a) / (sigma * sigma)) * (0.25 + 0.75 * crisp);
      if (crisp < 0.85) s = s * crisp + (1 - crisp) * Math.random() * 0.25; // σκόρπια άμμος
      const i = (y * W + x) * 4;
      img.data[i] = 24 + 231 * s; img.data[i + 1] = 16 + 183 * s; img.data[i + 2] = 48 + 59 * s;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  chlStatus.textContent = (crisp > 0.6 ? T('chl_on') : T('chl_off')).replace('{f}', bf.toFixed(1));
  chlStatus.style.color = crisp > 0.6 ? 'var(--accent)' : 'var(--muted)';
}
chlSlider.oninput = () => { chlFreq.value = chlSlider.value; drawChladni(); };
chlFreq.oninput = () => { chlSlider.value = chlFreq.value; drawChladni(); };
chlPlate.oninput = drawChladni;
document.querySelectorAll('#panel-chladni .chip').forEach(c => c.onclick = () => {
  chlFreq.value = c.dataset.f; chlSlider.value = c.dataset.f;
  document.querySelectorAll('#panel-chladni .chip').forEach(x => x.classList.toggle('sel', x === c));
  drawChladni();
});

// ---------- language switch ----------
function applyLang(l) {
  LANG = I18N[l] ? l : 'el';
  localStorage.setItem('lang432', LANG);
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('.langs .chip').forEach(c => c.classList.toggle('sel', c.dataset.l === LANG));
  renderTones();
  drawChladni();
}
document.querySelectorAll('.langs .chip').forEach(c => c.onclick = () => applyLang(c.dataset.l));
applyLang(LANG);

// ---------- PWA offline ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
