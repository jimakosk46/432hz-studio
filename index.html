<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>432Hz Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="icon192.png">
<meta name="theme-color" content="#0a0618">
<meta name="description" content="Frequencies &amp; tone generator — FFT-verified tracks">
<meta property="og:type" content="website">
<meta property="og:title" content="432Hz Studio">
<meta property="og:description" content="Συχνότητες, γεννήτρια τόνων και κουρδιστήρι στα 432 Hz — μουσική ελεγμένη με FFT, και offline.">
<meta property="og:locale" content="el_GR">
<meta property="og:url" content="https://jimakosk46.github.io/432hz-studio/">
<meta property="og:image" content="https://jimakosk46.github.io/432hz-studio/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jimakosk46.github.io/432hz-studio/og-image.jpg">
<!-- iOS launch screens (only used from the Home Screen). 1179×2556: iPhone 14 Pro/15/15 Pro/16;
     1170×2532: iPhone 12/13/14. Other devices fall back to the plain theme colour. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-startup-image" href="splash-1179x2556.jpg" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash-1170x2532.jpg" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="stylesheet" href="app.css">
<style>
.tab {
    flex: 1 1 150px; padding: 12px 6px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); color: var(--muted); font-size: .9rem;
    cursor: pointer; transition: all .15s;
  }
#drop {
    border: 2px dashed var(--border); border-radius: 12px; padding: 30px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: all .15s;
  }
#drop:hover { border-color: var(--accent); color: var(--text); background: #1d1440; }
#liveAudio { width: 100%; margin-top: 14px; }
footer { text-align: center; color: #8f83b8; font-size: .8rem; margin-top: 26px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <!-- shared:top -->
  <header>
    <h1>🎵 <span>432Hz</span> Studio</h1>
    <p data-i18n="subtitle"></p>
    <p style="color:#8f83b8;font-size:.82rem;margin-top:3px" data-i18n="credit"></p>
    <div class="langs" role="group" aria-label="Language / Sprache / Γλώσσα">
      <button class="chip" data-l="el">Ελληνικά</button>
      <button class="chip" data-l="de">Deutsch</button>
      <button class="chip" data-l="en">English</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="conv" data-i18n="tab_conv"></button>
    <button class="tab" data-tab="tone" data-i18n="tab_tone"></button>
    <button class="tab" data-tab="heal" data-i18n="tab_heal"></button>
    <button class="tab" data-tab="chladni" data-i18n="tab_chl"></button>
    <button class="tab" data-tab="crystal" data-i18n="tab_cry"></button>
    <button class="tab" data-tab="tuner" data-i18n="tab_tuner"></button>
  </div>
  <!-- Πρόσφατα + εξαγωγή/εισαγωγή: κλειστό από προεπιλογή, ώστε η κεφαλίδα να μένει ήσυχη -->
  <details class="tools-box" id="toolsBox">
    <summary data-i18n="tools_title"></summary>
    <div class="tools-body">
      <div class="tools-label" data-i18n="recent_title"></div>
      <div class="recent-list" id="recentList"></div>
      <p class="tools-empty" id="recentEmpty" data-i18n="recent_empty"></p>
      <div class="tools-actions">
        <button type="button" class="chip hidden" id="clearRecents" data-i18n="recent_clear"></button>
        <button type="button" class="chip" id="exportSettings" data-i18n="settings_export"></button>
        <button type="button" class="chip" id="importSettings" data-i18n="settings_import"></button>
        <input type="file" id="settingsImportFile" accept="application/json,.json" hidden>
      </div>
      <p class="tools-hint" data-i18n="settings_hint"></p>
      <div class="tools-status" id="settingsStatus" role="status" aria-live="polite"></div>
    </div>
  </details>
  <div id="toast" class="hidden"></div>
  <!-- /shared:top -->

  <main id="main-content">
  <!-- ===================== LIVE 432Hz PLAYER ===================== -->
  <div class="card" id="panel-conv">
    <div id="drop" role="button" tabindex="0" aria-controls="file" aria-labelledby="dropLabel dropFormats">
      <span class="big" aria-hidden="true">🎧</span>
      <span id="dropLabel" data-i18n="drop_text"></span>
      <div id="dropFormats" style="font-size:.8rem;margin-top:6px">MP3, WAV, FLAC, M4A, OGG…</div>
      <div id="fileName" aria-live="polite" aria-hidden="true"></div>
    </div>
    <input type="file" id="file" accept="audio/*" style="display:none">

    <label class="small" for="target" data-i18n="target_label"></label>
    <div class="freq-row">
      <input type="number" id="target" value="432" min="300" max="500" step="0.1">
      <button class="chip sel" data-f="432">432 Hz</button>
      <button class="chip" data-f="444">444 Hz</button>
      <button class="chip" data-f="424">424 Hz</button>
    </div>

    <audio id="liveAudio" controls class="hidden"></audio>
    <div class="actbar" style="justify-content:center;margin-top:12px">
      <button class="chip" id="retuneExport" type="button" data-i18n="retune_export" disabled></button>
      <button class="chip hidden" id="retuneCancel" type="button" data-i18n="retune_cancel"></button>
    </div>
    <progress id="retuneProgress" class="hidden" max="1" value="0" aria-labelledby="retuneExport"></progress>
    <div id="retuneStatus" class="small" role="status" aria-live="polite"></div>
    <div class="small" data-i18n="retune_memory" style="margin-top:8px"></div>
    <div class="note" data-i18n="live_note"></div>
  </div>

  <!-- shared:panels -->
  <!-- ===================== TONE GENERATOR ===================== -->
  <div class="card hidden" id="panel-tone">
    <div class="freq-display">
      <label class="visually-hidden" for="tfreq" data-i18n="chl_freq"></label>
      <input type="number" id="tfreq" value="432" min="1" max="20000" step="0.1"><span class="hz">Hz</span>
    </div>
    <label class="visually-hidden" for="tslider" data-i18n="chl_freq"></label>
    <input type="range" id="tslider" min="0" max="1000" value="614">

    <div class="presets">
      <button class="chip" data-f="174">174</button>
      <button class="chip" data-f="285">285</button>
      <button class="chip" data-f="396">396</button>
      <button class="chip" data-f="417">417</button>
      <button class="chip sel" data-f="432">432</button>
      <button class="chip" data-f="528">528</button>
      <button class="chip" data-f="639">639</button>
      <button class="chip" data-f="741">741</button>
      <button class="chip" data-f="852">852</button>
      <button class="chip" data-f="963">963</button>
    </div>

    <div class="row2" style="margin-top:18px">
      <div>
        <label class="small" for="wave" data-i18n="waveform"></label>
        <select id="wave">
          <option value="sine" data-i18n="wave_sine"></option>
          <option value="triangle" data-i18n="wave_triangle"></option>
          <option value="square" data-i18n="wave_square"></option>
          <option value="sawtooth" data-i18n="wave_saw"></option>
        </select>
      </div>
      <div>
        <label class="small" for="vol" data-i18n="volume"></label>
        <input type="range" id="vol" min="0" max="100" value="40" style="margin-top:12px">
      </div>
    </div>

    <div class="playbtns">
      <button class="btn" id="play" data-i18n="play"></button>
      <button class="btn stop hidden" id="stop" data-i18n="stop"></button>
    </div>

    <label class="small" for="wavdur" data-i18n="wav_label"></label>
    <div class="freq-row">
      <input type="number" id="wavdur" value="60" min="1" max="600">
      <button class="btn ghost" id="wavdl" style="flex:1;margin-top:0;width:auto" data-i18n="wav_btn"></button>
    </div>
    <label class="small" data-i18n="sleep_label"></label>
    <div class="freq-row sleeprow">
      <button class="chip" data-sleep="15">15′</button>
      <button class="chip" data-sleep="30">30′</button>
      <button class="chip" data-sleep="60">60′</button>
      <button class="chip" data-sleep="90">90′</button>
      <button class="chip sel" data-sleep="0" data-i18n="sleep_off"></button>
      <span class="sleepleft"></span>
    </div>
    <div class="actbar">
      <button class="chip" data-act="fav" data-tab="tone" data-i18n="act_fav"></button>
      <button class="chip" data-act="share" data-i18n="act_share"></button>
    </div>
    <div class="favs" data-favs="tone"></div>
  </div>

  <!-- ===================== HEALING TONES ===================== -->
  <div class="card hidden" id="panel-heal">
    <div class="tones" id="tonelist"></div>
    <label class="small" data-i18n="sleep_label"></label>
    <div class="freq-row sleeprow">
      <button class="chip" data-sleep="15">15′</button>
      <button class="chip" data-sleep="30">30′</button>
      <button class="chip" data-sleep="60">60′</button>
      <button class="chip" data-sleep="90">90′</button>
      <button class="chip sel" data-sleep="0" data-i18n="sleep_off"></button>
      <span class="sleepleft"></span>
    </div>
    <div class="actbar">
      <button class="chip" data-act="share" data-i18n="act_share"></button>
    </div>
    <details class="history-facts" id="historyFacts">
      <summary data-i18n="history_title"></summary>
      <div class="history-body">
        <p data-i18n="history_intro"></p>
        <h3 data-i18n="history_section_verdi"></h3>
        <p data-i18n="history_verdi"></p>
        <h3 data-i18n="history_section_1939"></h3>
        <p data-i18n="history_1939"></p>
        <p data-i18n="history_rrg"></p>
        <h3 data-i18n="history_section_iso"></h3>
        <p data-i18n="history_iso"></p>
        <p data-i18n="history_claims"></p>
        <h3 data-i18n="history_sources"></h3>
        <ul>
          <li><a href="https://education.persee.fr/doc/baip_1254-0714_1860_num_11_132_9814" target="_blank" rel="noopener noreferrer" data-i18n="history_source_france"></a></li>
          <li><a href="https://doi.org/10.1017/S1479409824000375" target="_blank" rel="noopener noreferrer" data-i18n="history_source_verdi"></a></li>
          <li><a href="https://doi.org/10.1038/143905a0" target="_blank" rel="noopener noreferrer" data-i18n="history_source_nature"></a></li>
          <li><a href="https://www.worldradiohistory.com/INTERNATIONAL/Funkschau/1939/Funkschau-1939-29.pdf" target="_blank" rel="noopener noreferrer" data-i18n="history_source_funkschau"></a></li>
          <li><a href="https://doi.org/10.7208/chicago/9780226823270.003.0005" target="_blank" rel="noopener noreferrer" data-i18n="history_source_gribenski"></a></li>
          <li><a href="https://svs.gsfc.nasa.gov/10891/" target="_blank" rel="noopener noreferrer" data-i18n="history_source_nasa"></a></li>
          <li><a href="https://cdn.standards.iteh.ai/samples/51/8fc4068ddfcc4f628708d05d0aafd5b2/ISO-R-16-1955.pdf" target="_blank" rel="noopener noreferrer" data-i18n="history_source_r16"></a></li>
          <li><a href="https://preview.sist.si/sist-preview/3601/3e7b175fdcae4a2aa09f9d0db4ac099d/ISO-16-1975.pdf" target="_blank" rel="noopener noreferrer" data-i18n="history_source_iso16_pdf"></a></li>
          <li><a href="https://www.iso.org/standard/3601.html" target="_blank" rel="noopener noreferrer" data-i18n="history_source_iso16"></a></li>
        </ul>
      </div>
    </details>
  </div>

  <!-- ===================== CHLADNI PATTERNS ===================== -->
  <div class="card hidden" id="panel-chladni">
    <div class="freq-row" style="justify-content:center">
      <button class="chip sel" id="chlShapePlate" data-i18n="chl_shape_plate"></button>
      <button class="chip" id="chlShapeDrop" data-i18n="chl_shape_drop"></button>
    </div>
    <div class="note" id="chlNote" data-i18n="chl_note"></div>
    <!-- ΔΥΟ καμβάδες, όχι ένας: ένας καμβάς HTML δέχεται ΕΝΑΝ και μόνο τύπο context σε
         όλη τη ζωή του. Ο #chl είναι δεσμευμένος σε 2d από την πλάκα Chladni, οπότε η
         σταγόνα σε WebGL2 χρειάζεται δικό της. Δείχνεται ο ένας, κρύβεται ο άλλος. -->
    <div style="text-align:center;margin-top:14px">
      <div id="chlFallbackStack" class="chl-fallback-stack">
        <canvas id="chl" width="300" height="300" style="width:100%;max-width:340px;height:auto;border-radius:12px;border:1px solid var(--border);background:#181030"></canvas>
        <canvas id="chlReflection" class="chl-fallback-overlay hidden" width="300" height="300" aria-hidden="true"></canvas>
        <canvas id="chlDrop2d" class="chl-fallback-overlay hidden" width="300" height="300" aria-hidden="true"></canvas>
      </div>
      <canvas id="chlDrop" class="hidden" width="300" height="300" style="width:100%;max-width:340px;height:auto;border-radius:12px;border:1px solid var(--border);background:#120b28"></canvas>
    </div>
    <div class="actbar" style="justify-content:center;margin-top:10px">
      <button class="chip" id="chlMicStart" type="button" data-i18n="chl_mic_start"></button>
      <button class="chip hidden" id="chlMicStop" type="button" data-i18n="chl_mic_stop"></button>
    </div>
    <div id="chlMicState" class="small" role="status" aria-live="polite" style="text-align:center;min-height:1.4em;margin-top:5px"></div>
    <div id="chlSimulationLabel" class="small" data-i18n="chl_simulation" style="text-align:center;margin:5px 0"></div>
    <div id="chlStatus" style="text-align:center;margin-top:10px;min-height:22px;font-size:.9rem"></div>
    <div class="small" id="chlRotateHint" style="text-align:center;margin-top:4px;opacity:.65"></div>
    <div id="chlDropControls" class="hidden" style="text-align:center;margin-top:8px">
      <button class="chip" id="chlDropPlay" type="button" aria-pressed="false" data-i18n="chl_drop_play"></button>
      <label class="small" for="chlDropSpeed"><span data-i18n="chl_drop_speed"></span>: <b id="chlDropSpeedVal" style="color:var(--accent)"></b></label>
      <input type="range" id="chlDropSpeed" min="0" max="1000" step="1" value="368">
      <label class="small" for="chlDropVol" data-i18n="chl_drop_volume"></label>
      <input type="range" id="chlDropVol" min="0" max="1" step="0.01" value="0.25">
    </div>
    <label class="small" for="chlFreq" data-i18n="chl_freq"></label>
    <div class="freq-row">
      <input type="number" id="chlFreq" value="432" min="200" max="1000" step="0.1">
      <button class="chip sel" data-f="432">432 Hz</button>
      <button class="chip" data-f="440">440 Hz</button>
      <button class="chip" data-f="528">528 Hz</button>
    </div>
    <label class="visually-hidden" for="chlSlider" data-i18n="chl_freq"></label>
    <input type="range" id="chlSlider" min="200" max="1000" step="0.5" value="432" style="margin-top:10px">
    <label class="small" for="chlPlate"><span id="chlPlateLabel" data-i18n="chl_plate"></span>: <b id="chlPlateVal" style="color:var(--accent)">100%</b></label>
    <input type="range" id="chlPlate" min="90" max="110" step="0.1" value="100">
    <details class="history-facts hidden" id="chlDropSources">
      <summary data-i18n="chl_drop_sources"></summary>
      <div class="history-body">
        <ul>
          <li><a href="https://doi.org/10.1103/PhysRevE.81.046305" target="_blank" rel="noopener noreferrer" data-i18n="chl_drop_source_shen"></a></li>
          <li><a href="https://arxiv.org/abs/1310.2967" target="_blank" rel="noopener noreferrer" data-i18n="chl_drop_source_ran"></a></li>
          <li><a href="https://doi.org/10.1088/0256-307X/27/7/076801" target="_blank" rel="noopener noreferrer" data-i18n="chl_drop_source_shen_cpl"></a></li>
        </ul>
      </div>
    </details>
    <div class="actbar">
      <button class="chip" data-act="fav" data-tab="chladni" data-i18n="act_fav"></button>
      <button class="chip" data-act="share" data-i18n="act_share"></button>
      <button class="chip" data-act="png" data-i18n="act_png"></button>
    </div>
    <div class="favs" data-favs="chladni"></div>
  </div>

  <!-- ===================== FREQUENCY CRYSTALS ===================== -->
  <div class="card hidden" id="panel-crystal">
    <div class="note" data-i18n="cry_note"></div>
    <div style="text-align:center;margin-top:14px">
      <canvas id="cry" width="300" height="300" style="width:100%;max-width:340px;height:auto;border-radius:12px;border:1px solid var(--border);background:#181030"></canvas>
    </div>
    <div id="cryTitle" style="text-align:center;margin-top:10px;color:var(--accent2);font-size:.95rem;font-weight:600"></div>
    <label class="small" for="cryFreq" data-i18n="chl_freq"></label>
    <div class="freq-row">
      <input type="number" id="cryFreq" value="432" min="20" max="2000" step="0.1">
      <button class="chip sel" data-f="432">432</button>
      <button class="chip" data-f="440">440</button>
      <button class="chip" data-f="528">528</button>
      <button class="chip" data-f="963">963</button>
    </div>
    <button class="btn ghost" id="cryAgain" style="margin-top:16px" data-i18n="cry_again"></button>
    <div class="actbar">
      <button class="chip" data-act="fav" data-tab="crystal" data-i18n="act_fav"></button>
      <button class="chip" data-act="share" data-i18n="act_share"></button>
      <button class="chip" data-act="png" data-i18n="act_png"></button>
    </div>
    <div class="favs" data-favs="crystal"></div>
  </div>
  <!-- ===================== TUNER ===================== -->
  <div class="card hidden" id="panel-tuner">
    <div class="note" data-i18n="tuner_note"></div>

    <label class="small" data-i18n="tuner_instrument"></label>
    <div class="presets" id="tunerInstruments"></div>

    <label class="small" for="tunerA4" data-i18n="tuner_ref"></label>
    <div class="freq-row">
      <input type="number" id="tunerA4" value="432" min="390" max="460" step="0.1">
      <button class="chip sel" data-a="432">432 Hz</button>
      <button class="chip" data-a="440">440 Hz</button>
    </div>

    <div class="note tunernote hidden" id="tunerHint"></div>

    <div class="note tunernote" data-i18n="tuner_tap"></div>

    <div class="courses" id="tunerCourses"></div>

    <div id="tunerReadout"></div>
    <div class="centsbar">
      <span class="centsend" data-i18n="tuner_flat"></span>
      <div class="centstrack">
        <div class="centszero"></div>
        <div class="centsmark" id="centsMark"></div>
      </div>
      <span class="centsend" data-i18n="tuner_sharp"></span>
    </div>
    <div id="tunerAdvice"></div>

    <button class="btn" id="micStart" data-i18n="mic_start"></button>
    <div class="note tunernote hidden" id="micError"></div>

    <div class="actbar">
      <button class="chip" data-act="share" data-i18n="act_share"></button>
    </div>
  </div>
  <!-- /shared:panels -->
  </main>

  <footer>432Hz Studio · <span data-i18n="credit"></span><br><span data-i18n="install_hint"></span></footer>
</div>

<script src="audio_capture.js"></script>
<script src="chladni_live.js"></script>
<script src="app.js"></script>
<script src="tuning_lab.js"></script>
<script src="settings_transfer.js"></script>
<script src="offline.js"></script>
<script>
// ---------- κείμενα ειδικά αυτής της εφαρμογής ----------
const I18N_APP = {
  el: {
    subtitle: "Συχνότητες & γεννήτρια τόνων",
    tab_conv: "Τραγούδι στα 432Hz",
    drop_text: "Διάλεξε ένα τραγούδι από το κινητό σου",
    live_note: "Το τραγούδι παίζει ζωντανά κουρδισμένο στη συχνότητα-στόχο (κλασική μέθοδος: ~1,8% πιο αργό, φυσικός ήχος χωρίς time-stretching).",
    retune_export: "💾 Αποθήκευση κουρδισμένου WAV", retune_cancel: "Ακύρωση",
    retune_cancel_pending: "Η αποκωδικοποίηση δεν διακόπτεται από τον browser· η ακύρωση θα εφαρμοστεί μόλις ολοκληρωθεί.",

// ---------- live 432Hz player (client-side) ----------
const drop = document.getElementById('drop'), fileInp = document.getElementById('file');
const fileName = document.getElementById('fileName');
const liveAudio = document.getElementById('liveAudio');
const targetInp = document.getElementById('target');
const retuneExportBtn = document.getElementById('retuneExport');
const retuneCancelBtn = document.getElementById('retuneCancel');
const retuneProgress = document.getElementById('retuneProgress');
const retuneStatus = document.getElementById('retuneStatus');
let retuneController = null;
let liveUrl = null;

function liveRate() {
  const t = +targetInp.value || 432;
  return Math.min(500, Math.max(300, t)) / 440;
}
function applyLiveRate() {
  try {
    liveAudio.preservesPitch = false;
    if ('webkitPreservesPitch' in liveAudio) liveAudio.webkitPreservesPitch = false;
    const r = liveRate();
    if (Math.abs(liveAudio.playbackRate - r) > 0.0005) liveAudio.playbackRate = r;
  } catch (e) {}
}
// σταματά το τραγούδι όταν ξεκινά τόνος/θεραπευτικό κομμάτι (ένα πράγμα τη φορά)
function stopSongPlayer() { if (!liveAudio.paused) liveAudio.pause(); }
drop.onclick = () => fileInp.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInp.click(); } };
fileInp.onchange = () => {
  const f = fileInp.files[0];
  if (!f) return;
  stopTone(); stopMusic();
  if (liveUrl) URL.revokeObjectURL(liveUrl);
  liveUrl = URL.createObjectURL(f);
  fileName.textContent = '✓ ' + f.name;
  retuneExportBtn.disabled = false;
  retuneStatus.textContent = '';
  retuneProgress.classList.add('hidden');
  liveAudio.src = liveUrl;
  liveAudio.classList.remove('hidden');
  applyLiveRate();
  liveAudio.play().catch(() => {});
};
const retuneBytes = n => n < 1024 * 1024 ? Math.ceil(n / 1024) + ' KiB' : (n / 1024 / 1024).toFixed(1) + ' MiB';
retuneExportBtn.onclick = async () => {
  const file = fileInp.files && fileInp.files[0];
  if (!file || retuneController) return;
  retuneController = new AbortController();
  const signal = retuneController.signal;
  retuneExportBtn.disabled = true;
  retuneCancelBtn.classList.remove('hidden');
  retuneProgress.classList.remove('hidden');
  retuneProgress.value = 0;
  try {
    const targetHz = Math.min(500, Math.max(300, +targetInp.value || 432));
    const wav = await window.RetuneExport.decodeFileToWav(file, targetHz, {
      signal,
      onProgress(value) {
        retuneProgress.value = value;
        retuneProgress.setAttribute('aria-valuetext', Math.round(value * 100) + '%');
        retuneStatus.textContent = value < 0.1 ? T('retune_decoding') : T('retune_progress').replace('{pct}', Math.round(value * 100));
      },
    });
    const url = URL.createObjectURL(wav), link = document.createElement('a');
    const base = file.name.replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|]/g, '_');
    link.href = url; link.download = `${base}_${targetHz.toFixed(0)}Hz.wav`; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    retuneProgress.value = 1; retuneStatus.textContent = T('retune_done');
  } catch (error) {
    retuneStatus.textContent = error.name === 'AbortError' ? T('retune_cancelled')
      : error.message === 'estimated-memory-limit' ? T('retune_too_large').replace('{size}', retuneBytes(error.estimatedBytes)) : T('retune_failed');
  } finally {
    retuneController = null; retuneCancelBtn.classList.add('hidden');
    retuneExportBtn.disabled = !(fileInp.files && fileInp.files[0]);
  }
};
retuneCancelBtn.onclick = () => {
  if (!retuneController) return;
  if (retuneProgress.value < 0.1) retuneStatus.textContent = T('retune_cancel_pending');
  retuneController.abort();
};
['ratechange', 'play', 'loadedmetadata'].forEach(ev => liveAudio.addEventListener(ev, applyLiveRate));
targetInp.oninput = applyLiveRate;
document.querySelectorAll('#panel-conv .chip[data-f]').forEach(c => c.onclick = () => {
  targetInp.value = c.dataset.f;
  selectChip('#panel-conv .chip', c);
  applyLiveRate();
});

startApp({
  i18n: I18N_APP,
  trackUrl: f => 'tracks/' + encodeURIComponent(f) + '.mp3',
  stopSongPlayer,
});
PwaOffline.mountOfflineControls({ root: document, tones: TONES, translate: T, getLanguage: () => LANG });

// ---------- PWA offline ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
